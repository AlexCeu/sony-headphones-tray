[package]
name = "sony-headphones-tray"
version = "0.1.0"
edition = "2021"
authors = ["TheOneProgrammer <https://theoneprogrammer.com>"]
license = "GPL-2.0-or-later"
description = "Cambia el modo de sonido de los auriculares Sony desde la bandeja de KDE"
repository = ""

[dependencies]
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[profile.release]
strip = true
lto = true
codegen-units = 1